name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  Build:
    name: build-binary
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build metadata
        id: build
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Select a branch when running this workflow." >&2
            exit 1
          fi
          appVer=$(tr -d '\r\n' < version)
          commitId=$(git rev-parse HEAD)
          image="ghcr.io/${REPOSITORY,,}"
          releaseTag="v${appVer}-${GITHUB_RUN_NUMBER}"
          echo "APP_VER=$appVer" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$commitId" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$releaseTag" >> "$GITHUB_ENV"
          echo "commit=$commitId" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$appVer" "$commitId" "$GITHUB_REF" "$GITHUB_REF_NAME" > version_info

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'

      - name: Build web
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ env.APP_VER }}-${{ github.run_number }}

      - name: Build and push
        id: docker
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha,scope=anylink-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=anylink-${{ github.ref_name }}
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            appVer=${{ env.APP_VER }}
            commitId=${{ env.COMMIT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build deploy binary
        shell: bash
        env:
          RELEASE_IMAGE: ${{ env.IMAGE }}@${{ steps.docker.outputs.digest }}
        run: bash release.sh "$RELEASE_IMAGE"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.build.outputs.commit }}
          name: ${{ env.RELEASE_TAG }} (${{ github.ref_name }})
          fail_on_unmatched_files: true
          files: artifact-dist/*
